version: "3.8"

services:
  backend:
    build: ./backend
    container_name: backend
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    ports:
      - "4500:4500"
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: frontend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "3800:3800"
    environment:
      - REACT_APP_API_URL=http://114.71.51.34:4500
    depends_on:
      - backend